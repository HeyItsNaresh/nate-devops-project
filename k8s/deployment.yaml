apiVersion: apps/v1
kind: Deployment
metadata:
  name: nate-rails-deployment
  labels:
    app: nate-rails

spec:
  replicas: 1

  selector:
    matchLabels:
      app: nate-rails

  template:
    metadata:
      labels:
        app: nate-rails

    spec:
      containers:
        - name: nate-rails
          image: nate-rails-app:latest
          imagePullPolicy: Never

          ports:
            - containerPort: 3000

          env:
            - name: RAILS_ENV
              value: production

            - name: DB_HOST
              value: nate-mariadb

            - name: DB_PORT
              value: "3306"

            - name: DB_USER
              value: nate_devops_user

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nate-db-secret
                  key: db-password

            - name: SECRET_KEY_BASE_DUMMY
              value: "1"

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          readinessProbe:
            httpGet:
              path: /up
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /up
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20